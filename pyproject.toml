[project]
name = "ticket-memory-rag"
version = "2.0.0"
description = "Helpdesk memory: index past tickets and resolutions, then surface similar cases beside the live incident with suggested replies."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
